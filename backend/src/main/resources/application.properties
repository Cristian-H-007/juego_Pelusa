spring.application.name=pelusas-backend
server.port=8080

# Base de datos H2 en archivo: el histórico de partidas se conserva entre reinicios (carpeta backend/data)
spring.datasource.url=jdbc:h2:file:./data/pelusas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la base de datos: http://localhost:8080/h2-console (JDBC URL igual a la de arriba)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
